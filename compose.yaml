services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fyacredits};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      Authentication__Issuer: ${JWT_ISSUER:-fya-credits}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Authentication__SeedEmail: ${SEED_EMAIL:-ana.comercial@fyasocialcapital.com}
      Authentication__SeedPassword: ${SEED_PASSWORD:?SEED_PASSWORD must be set}
      Authentication__ResetPasswordBaseUrl: ${RESET_PASSWORD_BASE_URL:-com.fya.credits://reset-password}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_WEB:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_WEB_ALT:-http://127.0.0.1:4200}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_CAPACITOR_HTTP:-http://localhost}
      Cors__AllowedOrigins__3: ${CORS_ORIGIN_CAPACITOR_HTTPS:-https://localhost}
      Email__Enabled: ${EMAIL_ENABLED:-true}
      Email__From: ${EMAIL_FROM:-no-reply@fyasocialcapital.com}
      Email__To: ${EMAIL_TO:-diomedescerda@gmail.com}
      Email__Renderer__Url: ${EMAIL_RENDERER_URL:-http://email-renderer:3000/render}
      Email__Smtp__Host: ${SMTP_HOST:-smtp.example.com}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fyacredits}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  email-renderer:
    build:
      context: ./emails
      dockerfile: Dockerfile
    environment:
      PORT: 3000
    ports:
      - "${EMAIL_RENDERER_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
